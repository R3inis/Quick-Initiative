<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body { font-family: sans-serif; color: white; background: #2E3136; margin: 0; padding: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    input[type="number"] { width: 60px; padding: 4px; text-align: center; border-radius: 4px; }
    .radio-group { display: flex; flex-direction: column; gap: 4px; font-size: 14px; margin-bottom: 15px; }
    button { width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="row">
    <label>Modifier (Blank = N/A):</label>
    <!-- Removed value="0" so it defaults to blank (N/A) -->
    <input type="number" id="modInput" placeholder="N/A" />
  </div>
  
  <div class="radio-group">
    <label><input type="radio" name="rollType" value="advantage"> Advantage</label>
    <label><input type="radio" name="rollType" value="flat" checked> Flat</label>
    <label><input type="radio" name="rollType" value="disadvantage"> Disadvantage</label>
  </div>

  <button id="saveBtn">Save to Token</button>

  <script type="module" src="/src/token-ui.js"></script>
</body>
</html>
